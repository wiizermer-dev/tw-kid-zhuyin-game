<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>注音王｜好友對戰限動</title>
  <style>
    @font-face {
      font-family: "Edu Kai";
      src: url("../public/fonts/edukai.woff2") format("woff2");
      font-display: swap;
    }

    :root {
      --ink: #332624;
      --soft-ink: #826f69;
      --cream: #fff4e7;
      --paper: #fffaf5;
      --coral: #ff5964;
      --coral-deep: #d93d4d;
      --mint: #4fcac3;
      --mint-deep: #249b96;
      --gold: #ffb43e;
      --violet: #9b7cff;
      --peach: #ffe3d7;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #1f1a18;
    }

    body {
      display: grid;
      place-items: center;
      font-family: "Edu Kai", "Noto Sans TC", "PingFang TC", sans-serif;
      color: var(--ink);
    }

    .story {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 16%, rgba(255, 255, 255, .92) 0 12%, transparent 28%),
        radial-gradient(circle at 82% 64%, rgba(255, 218, 203, .78) 0 18%, transparent 38%),
        linear-gradient(180deg, #fff5e8 0%, #fff0ea 46%, #ffe6ee 100%);
      isolation: isolate;
    }

    .story::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.34) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.22) 1px, transparent 1px);
      background-size: 48px 48px;
      opacity: .22;
      mix-blend-mode: soft-light;
      pointer-events: none;
    }

    .glyph {
      position: absolute;
      z-index: 0;
      font-size: var(--size);
      line-height: 1;
      color: var(--color);
      opacity: .22;
      transform: rotate(var(--rotate));
      filter: blur(.1px);
    }

    .g1 { --size: 230px; --color: #ff767d; --rotate: -7deg; top: 72px; left: 600px; }
    .g2 { --size: 180px; --color: #5bc5c0; --rotate: 13deg; top: 670px; right: -20px; }
    .g3 { --size: 210px; --color: #ffd67b; --rotate: 18deg; bottom: 105px; left: 130px; }
    .g4 { --size: 150px; --color: #a58cff; --rotate: -15deg; top: 360px; left: 60px; }
    .g5 { --size: 170px; --color: #ff8d92; --rotate: -10deg; bottom: 430px; right: 95px; }
    .g6 { --size: 160px; --color: #ffbf64; --rotate: 10deg; top: 1030px; left: 475px; }
    .g7 { --size: 135px; --color: #6fd0cc; --rotate: 8deg; top: 250px; right: 70px; }
    .g8 { --size: 150px; --color: #ff8d92; --rotate: -8deg; top: 1560px; right: 110px; }

    .content {
      position: relative;
      z-index: 1;
      height: 100%;
      padding: 108px 84px 86px;
      display: flex;
      flex-direction: column;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      min-height: 76px;
      padding: 0 30px;
      border: 5px solid rgba(51, 38, 36, .14);
      border-radius: 999px;
      background: rgba(255, 255, 255, .74);
      box-shadow: 0 20px 45px rgba(129, 84, 82, .13);
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 0;
      color: var(--soft-ink);
    }

    .kicker {
      margin-top: 96px;
      display: inline-flex;
      width: fit-content;
      padding: 20px 28px 16px;
      border-radius: 26px;
      background: var(--coral);
      color: white;
      font-size: 42px;
      font-weight: 1000;
      line-height: 1;
      box-shadow: 0 14px 0 var(--coral-deep);
      transform: rotate(-1.5deg);
    }

    h1 {
      margin: 56px 0 0;
      max-width: 920px;
      font-size: 150px;
      line-height: .94;
      letter-spacing: 0;
      font-weight: 1000;
      color: var(--ink);
    }

    h1 .accent {
      color: var(--coral);
      text-shadow: 0 10px 0 rgba(217, 61, 77, .14);
    }

    .sub {
      margin-top: 36px;
      max-width: 820px;
      color: var(--soft-ink);
      font-size: 52px;
      line-height: 1.18;
      font-weight: 800;
    }

    .code-panel {
      margin-top: 72px;
      border-radius: 58px;
      padding: 52px 48px 46px;
      background: rgba(255, 255, 255, .86);
      box-shadow:
        0 32px 70px rgba(118, 70, 72, .16),
        inset 0 -8px 0 rgba(234, 211, 198, .58);
      border: 4px solid rgba(255, 255, 255, .8);
    }

    .label {
      color: var(--soft-ink);
      font-size: 44px;
      font-weight: 900;
      line-height: 1;
    }

    .code {
      margin-top: 30px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 22px;
    }

    .code span {
      height: 164px;
      display: grid;
      place-items: center;
      border: 8px solid var(--mint);
      border-radius: 34px;
      background: linear-gradient(180deg, #ffffff 0%, #fff9f3 100%);
      color: var(--coral);
      font-size: 110px;
      font-weight: 1000;
      line-height: 1;
      box-shadow: 0 12px 0 rgba(36, 155, 150, .22);
    }

    .duel {
      margin-top: 44px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 24px;
    }

    .player {
      min-height: 154px;
      border-radius: 34px;
      padding: 26px 24px;
      background: var(--cream);
      box-shadow: inset 0 -7px 0 rgba(223, 198, 181, .7);
    }

    .player b {
      display: block;
      color: var(--ink);
      font-size: 38px;
      line-height: 1;
    }

    .player strong {
      display: block;
      margin-top: 16px;
      color: var(--coral);
      font-size: 58px;
      line-height: 1;
    }

    .versus {
      width: 108px;
      height: 108px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: var(--gold);
      color: #ffffff;
      font-size: 42px;
      font-weight: 1000;
      box-shadow: 0 10px 0 rgba(214, 135, 30, .28);
    }

    .updates {
      margin-top: 42px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .pill {
      min-height: 92px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 12px 20px;
      border-radius: 999px;
      font-size: 34px;
      font-weight: 1000;
      line-height: 1.05;
      color: #ffffff;
      box-shadow: 0 12px 0 rgba(43, 39, 36, .12);
    }

    .pill.mint {
      background: var(--mint);
    }

    .pill.violet {
      background: var(--violet);
    }

    .cta {
      margin-top: auto;
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }

    .button {
      min-height: 132px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: var(--coral);
      color: white;
      font-size: 56px;
      font-weight: 1000;
      line-height: 1;
      box-shadow: 0 16px 0 var(--coral-deep);
    }

    .url {
      text-align: center;
      color: var(--soft-ink);
      font-size: 36px;
      font-weight: 900;
      line-height: 1;
    }
  </style>
</head>
<body>
  <main class="story" aria-label="IG story poster for zhuyin duel update">
    <span class="glyph g1">ㄋ</span>
    <span class="glyph g2">ㄅ</span>
    <span class="glyph g3">ㄨ</span>
    <span class="glyph g4">ㄦ</span>
    <span class="glyph g5">ㄇ</span>
    <span class="glyph g6">ㄆ</span>
    <span class="glyph g7">ㄜ</span>
    <span class="glyph g8">ㄎ</span>

    <section class="content">
      <div class="brand">注音王</div>

      <div class="kicker">好友對戰新增</div>
      <h1><span class="accent">輸入注音</span><br>邀請碼</h1>
      <p class="sub">開房邀朋友，同題組多人同房競賽。</p>

      <section class="code-panel">
        <div class="label">四碼注音房號</div>
        <div class="code" aria-label="sample zhuyin invite code">
          <span>ㄅ</span>
          <span>ㄆ</span>
          <span>ㄇ</span>
          <span>ㄈ</span>
        </div>

        <div class="duel">
          <div class="player">
            <b>你</b>
            <strong>12 題</strong>
          </div>
          <div class="versus">VS</div>
          <div class="player">
            <b>朋友</b>
            <strong>11 題</strong>
          </div>
        </div>

        <div class="updates">
          <div class="pill mint">題目全面更新</div>
          <div class="pill violet">2 人起開戰</div>
        </div>
      </section>

      <div class="cta">
        <div class="button">現在就來ㄅㄆㄇ</div>
        <div class="url">zhuyin-run.vercel.app</div>
      </div>
    </section>
  </main>
</body>
</html>
